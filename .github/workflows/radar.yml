name: Radar JARVIS
on:
  schedule:
    - cron: "0 6 * * 1"
    - cron: "30 6 * * 3"
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "padel, lavoro o case"
        default: "padel"
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cerca e invia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1") MODE=padel;;
            "30 6 * * 3") MODE=lavoro;;
            "0 7 * * 5") MODE=case;;
            *) MODE="${{ github.event.inputs.mode }}";;
          esac
          python3 radar.py "$MODE"
